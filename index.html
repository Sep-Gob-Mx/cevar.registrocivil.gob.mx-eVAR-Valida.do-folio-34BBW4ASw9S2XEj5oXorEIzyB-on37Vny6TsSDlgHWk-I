<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Imagen</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            overflow-x: hidden;
            overflow-y: auto;
        }

        .imagen-pantalla {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>

<body>

    <img
        src="images/Sin título.jpg"
        class="imagen-pantalla"
        alt=""
    >

</body>
</html>
