<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Documento</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
        }

        html {
            background: white;
        }

        body {
            background: white;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* =========================
           PC
        ========================= */

        .contenedor {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .imagen-pantalla {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;
            object-position: top center;

            margin: 0;
            padding: 0;
        }


        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 600px) {

            html, body {
                width: 100%;
                height: auto;
                min-height: 0;
            }

            body {
                overflow-x: auto;
                overflow-y: auto;
            }

            .contenedor {
                width: 250vw;
                height: auto;

                margin: 0;
                padding: 0;

                display: block;
            }

            .imagen-pantalla {
                width: 250vw;
                height: auto;

                max-width: none;

                margin: 0;
                padding: 0;

                display: block;
            }
        }

    </style>
</head>

<body>

<div class="contenedor">

    <img
        src="images/Sin título.jpg"
        class="imagen-pantalla"
        id="documento"
        alt="Documento"
    >

</div>


<script>

const imagen = document.getElementById("documento");

function centrarImagen() {

    if (window.innerWidth <= 600) {

        const anchoImagen = imagen.getBoundingClientRect().width;

        const izquierda =
            (anchoImagen - window.innerWidth) / 2;

        window.scrollTo({
            left: izquierda,
            top: 0,
            behavior: "auto"
        });
    }
}


/* Esperamos a que la imagen cargue realmente */

if (imagen.complete) {
    setTimeout(centrarImagen, 300);
} else {
    imagen.addEventListener("load", function () {
        setTimeout(centrarImagen, 300);
    });
}


/* Algunos navegadores de celular
   modifican el viewport después de cargar */

window.addEventListener("pageshow", function () {
    setTimeout(centrarImagen, 500);
});

</script>

</body>
</html>
