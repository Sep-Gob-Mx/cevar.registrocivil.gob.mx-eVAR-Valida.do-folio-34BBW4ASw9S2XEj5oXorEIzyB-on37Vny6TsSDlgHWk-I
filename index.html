<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Documento</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            background: #000;
        }

        body {
            overflow-x: auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .contenedor {
            margin: 0;
            padding: 0;
            width: max-content;
            height: max-content;
            line-height: 0;
        }

        .imagen-pantalla {
            display: block;
            margin: 0;
            padding: 0;
        }

        /* =====================
           PC
        ===================== */

        @media (min-width: 601px) {

            .contenedor {
                width: 100vw;
                height: 100vh;
            }

            .imagen-pantalla {
                width: 100vw;
                height: 100vh;

                object-fit: contain;
                object-position: center;
            }
        }


        /* =====================
           CELULAR
        ===================== */

        @media (max-width: 600px) {

            .contenedor {
                width: 200vw;
            }

            .imagen-pantalla {
                width: 200vw;
                height: auto;
                max-width: none;
            }

        }
    </style>
</head>

<body>

    <div class="contenedor">
        <img
            src="images/Sin título.jpg"
            class="imagen-pantalla"
            id="documento"
            alt="Documento"
        >
    </div>


    <script>
        window.addEventListener("load", function () {

            if (window.innerWidth <= 600) {

                /*
                   La imagen mide 200vw.
                   Esto mueve la pantalla al centro
                   horizontal de la imagen.
                */

                const centro =
                    (document.documentElement.scrollWidth -
                     window.innerWidth) / 2;

                window.scrollTo({
                    left: centro,
                    top: 0,
                    behavior: "instant"
                });
            }

        });
    </script>

</body>
</html>
