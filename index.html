<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Documento</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body {
            background: #f2f2f2;

            /* Permite mover/deslizar la página */
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }

        .contenedor {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* =========================
           PC
        ========================== */
        .imagen-pantalla {
            width: 100vw;
            height: 100vh;

            object-fit: contain;
            object-position: top center;

            display: block;
        }


        /* =========================
           CELULAR
        ========================== */
        @media (max-width: 600px) {

            .contenedor {
                width: 200vw;

                display: flex;
                justify-content: flex-start;
                align-items: flex-start;
            }

            .imagen-pantalla {
                /* DOBLE DE GRANDE */
                width: 200vw;
                height: auto;

                max-width: none;

                object-fit: initial;

                display: block;
            }

        }

    </style>
</head>

<body>

    <div class="contenedor">

        <img
            src="images/Sin título.jpg"
            class="imagen-pantalla"
            alt="Documento"
        >

    </div>

</body>
</html>
