<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Documento</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #f2f2f2;

            /* Permite deslizar */
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        .contenedor {
            width: 100%;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px 10px;
        }

        .imagen-pantalla {
            width: 95%;
            max-width: 850px;
            height: auto;

            display: block;
        }

        /* CELULAR */
        @media (max-width: 600px) {

            .contenedor {
                min-height: 100vh;

                display: flex;
                justify-content: center;
                align-items: center;

                padding: 10px 5px;
            }

            .imagen-pantalla {
                /* Más grande en celular */
                width: 98%;
                max-width: none;
                height: auto;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <img
            src="images/Sin título.jpg"
            class="imagen-pantalla"
            alt="Documento"
        >

    </div>

</body>
</html>
